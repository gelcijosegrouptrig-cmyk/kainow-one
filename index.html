<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kainow IA Bot</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col">
    <header class="bg-slate-800 p-4 shadow-md flex justify-between items-center border-b border-slate-700/50">
        <h1 class="text-xl font-bold flex items-center gap-2">🤖 Kainow Full-Stack IA</h1>
        <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-medium border border-emerald-500/30 animate-pulse">Online</span>
    </header>
    <main class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full flex flex-col" id="chat-container">
        <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl text-slate-300 max-w-[85%] self-start">
            Olá! Eu sou o seu Agente Full-Stack automático. Digite abaixo o que você deseja criar!
        </div>
    </main>
    <footer class="p-4 bg-slate-800/50 border-t border-slate-700/50">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="prompt-input" placeholder="Ex: Crie um formulário de contato moderno..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 text-white">
            <button onclick="enviarPrompt()" id="btn-enviar" class="bg-blue-600 hover:bg-blue-500 font-medium px-6 py-3 rounded-xl transition-colors cursor-pointer">Enviar</button>
        </div>
    </footer>
    <script>
        async function enviarPrompt() {
            const input = document.getElementById('prompt-input');
            const container = document.getElementById('chat-container');
            const prompt = input.value.trim();
            if (!prompt) return;

            container.innerHTML += `<div class="bg-blue-600 p-4 rounded-xl text-white max-w-[85%] self-end">${prompt}</div>`;
            input.value = '';

            const pensandoId = 'ia-' + Date.now();
            container.innerHTML += `<div id="${pensandoId}" class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl text-slate-400 max-w-[85%] self-start italic">🤖 IA pensando e criando código...</div>`;

            // Conversa com o servidor interno do Codespaces que guarda o Token de forma oculta
            try {
                const response = await fetch('http://localhost:5000', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await response.json();
                
                document.getElementById(pensandoId).remove();
                container.innerHTML += `<div class="bg-emerald-600/20 border border-emerald-500/30 p-4 rounded-xl text-emerald-400 max-w-[85%] self-start">
                    <p class="font-bold">✅ Criado com sucesso!</p>
                    <a href="https://github.io{data.arquivo}" target="_blank" class="inline-block mt-2 bg-emerald-500 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg">Visualizar Página Criada 🌐</a>
                </div>`;
            } catch (err) {
                document.getElementById(pensandoId).remove();
                container.innerHTML += `<div class="bg-rose-600/20 border border-rose-500/30 p-4 rounded-xl text-rose-400 max-w-[85%] self-start">❌ Conecte o servidor no terminal executando: python servidor_ia.py</div>`;
            }
        }
    </script>
</body>
</html>
