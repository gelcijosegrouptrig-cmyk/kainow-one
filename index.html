<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kainow IA Bot</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col">
    <header class="bg-slate-800 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">🤖 Kainow Full-Stack IA</h1>
        <span class="bg-emerald-500/20 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-medium border border-emerald-500/30">Online</span>
    </header>
    <main class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full" id="chat-container">
        <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl text-slate-300">
            Olá! Eu sou o seu Agente Full-Stack. Digite abaixo o sistema ou página que você deseja que eu programe e envie para o seu GitHub.
        </div>
    </main>
    <footer class="p-4 bg-slate-800/50 border-t border-slate-700/50">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="prompt-input" placeholder="Ex: Crie uma página de login com Tailwind..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
            <button onclick="enviarPrompt()" class="bg-blue-600 hover:bg-blue-500 font-medium px-6 py-3 rounded-xl transition-colors">Enviar</button>
        </div>
    </footer>
</body>
</html>
