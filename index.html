<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kainow IA Bot</title>
    <!-- Link do Tailwind CSS corrigido para carregar o visual escuro -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans h-screen flex flex-col m-0 p-0">
    <header class="bg-slate-800 p-4 shadow-md flex justify-between items-center border-b border-slate-700">
        <h1 class="text-xl font-bold flex items-center gap-2">🤖 Kainow Full-Stack IA</h1>
        <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-medium border border-emerald-500/30 animate-pulse">Online</span>
    </header>
    
    <main class="flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl mx-auto w-full flex flex-col justify-start" id="chat-container">
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-slate-200 max-w-[85%] self-start shadow-lg mt-4">
            Olá! Eu sou o seu Agente Full-Stack automático. Digite abaixo o sistema, integração ou página que você deseja que eu programe agora!
        </div>
    </main>
    
    <footer class="p-4 bg-slate-800/80 border-t border-slate-700 sticky bottom-0">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input type="text" id="prompt-input" placeholder="Ex: Crie um formulário de contato moderno..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 text-white shadow-inner">
            <button onclick="enviarPrompt()" id="btn-enviar" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-md active:scale-95 cursor-pointer">Enviar</button>
        </div>
    </footer>

    <script>
        async function enviarPrompt() {
            const input = document.getElementById('prompt-input');
            const container = document.getElementById('chat-container');
            const btn = document.getElementById('btn-enviar');
            const prompt = input.value.trim();
            if (!prompt) return;

            input.disabled = true;
            btn.disabled = true;

            container.innerHTML += `<div class="bg-blue-600 p-4 rounded-xl text-white max-w-[85%] self-end shadow-md ml-auto">${prompt}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const pensandoId = 'ia-' + Date.now();
            container.innerHTML += `<div id="${pensandoId}" class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-slate-400 max-w-[85%] self-start italic shadow-md">🤖 IA pensando e criando código...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('http://localhost:5000', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await response.json();
                
                document.getElementById(pensandoId).remove();
                container.innerHTML += `<div class="bg-emerald-950 border border-emerald-500/30 p-4 rounded-xl text-emerald-400 max-w-[85%] self-start shadow-md">
                    <p class="font-bold text-emerald-300">✅ Criado com sucesso!</p>
                    <p class="text-xs text-slate-400 mt-1">O arquivo foi gravado no repositório.</p>
                    <a href="http://sixtechbrasil.com.br{data.arquivo}" target="_blank" class="inline-block mt-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold px-4 py-2 rounded-lg transition-all shadow-md">Visualizar Página Criada 🌐</a>
                </div>`;
            } catch (err) {
                if(document.getElementById(pensandoId)) document.getElementById(pensandoId).remove();
                container.innerHTML += `<div class="bg-rose-950 border border-rose-500/30 p-4 rounded-xl text-rose-400 max-w-[85%] self-start shadow-md">❌ Erro de conexão com o terminal do Codespaces. Verifique se o servidor está rodando!</div>`;
            }
            input.disabled = false;
            btn.disabled = false;
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
