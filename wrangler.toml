name = "kainow-one-ia"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "kainow_one_db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# Environment
env = "production"

# Routes
[env.production]
name = "kainow-one-ia-prod"
route = "api.kainow.dev/*"

[env.development]
name = "kainow-one-ia-dev"

# Build
[build]
command = "npm run build"
cwd = "./"
watch_paths = ["src/**/*.ts"]

# Triggers
[triggers]
crons = ["0 0 * * *"]
